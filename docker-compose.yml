services:
  rag:
    build: .
    container_name: rag-project
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - PDF_PATH=./data/中华人民共和国个人信息保护法样例.pdf
      - CHROMA_DB_DIR=./chroma_db
    volumes:
      - ./.env:/app/.env:ro
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data:ro
    working_dir: /app
    ports:
      - "8501:8501"
    command: streamlit run demo4_web_ui/app.py --server.address=0.0.0.0
